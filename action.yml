name: 'Java Checkstyle Lint'
description: 'Run Checkstyle linting with configurable thresholds and PR comments'
author: 'tusharkumarshahi'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  checkstyle-config:
    description: 'Checkstyle configuration file (google_checks.xml, sun_checks.xml, or path to custom)'
    required: false
    default: 'google_checks.xml'
  
  max-errors:
    description: 'Maximum number of errors allowed'
    required: false
    default: '0'
  
  max-warnings:
    description: 'Maximum number of warnings allowed'
    required: false
    default: '10'
  
  fail-on-error:
    description: 'Fail the check if thresholds are exceeded'
    required: false
    default: 'true'
  
  check-only-diff:
    description: 'Only check files changed in PR (faster)'
    required: false
    default: 'false'
  
  source-directory:
    description: 'Source directory to check'
    required: false
    default: 'src/main/java'
  
  github-token:
    description: 'GitHub token for creating PR comments'
    required: false
    default: ${{ github.token }}

outputs:
  error-count:
    description: 'Total number of errors found'
  
  warning-count:
    description: 'Total number of warnings found'
  
  info-count:
    description: 'Total number of info messages found'
  
  passed:
    description: 'Whether the check passed (true/false)'
  
  files-checked:
    description: 'Number of files checked'

runs:
  using: 'node20'
  main: 'dist/index.js'
